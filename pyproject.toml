[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali", email = "ali.al.moussawi@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "mlflow>=3.16.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.53.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
